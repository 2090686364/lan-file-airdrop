<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>局域网文件空投</title>
    <!-- Socket.IO客户端 -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 8px;
        }

        .info-box {
            background: linear-gradient(135deg, #e0f2fe, #bae6fd);
            border-left: 4px solid #0284c7;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .info-box-title {
            font-weight: 600;
            color: #075985;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .info-box-text {
            color: #0c4a6e;
            font-size: 14px;
            line-height: 1.6;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9ff;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            background: #f0f2ff;
            border-color: #764ba2;
            transform: translateY(-2px);
        }

        .upload-area.drag-over {
            background: #e8ebff;
            border-color: #764ba2;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 64px;
            margin-bottom: 15px;
        }

        .upload-text {
            font-size: 20px;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .upload-hint {
            color: #666;
            font-size: 14px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 150px;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f2ff;
            color: #667eea;
        }

        .btn-secondary:hover {
            background: #e8ebff;
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-download {
            background: #10b981;
            color: white;
        }

        .btn-download:hover {
            background: #059669;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        .progress-container {
            margin-bottom: 30px;
        }

        .file-item {
            background: #f8f9ff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .file-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .file-name {
            font-weight: 600;
            color: #333;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-right: 10px;
        }

        .file-size {
            color: #666;
            font-size: 14px;
            margin-right: 15px;
        }

        .file-status {
            font-size: 14px;
            font-weight: 600;
        }

        .status-uploading {
            color: #667eea;
        }

        .status-success {
            color: #10b981;
        }

        .status-error {
            color: #ef4444;
        }

        .status-resuming {
            color: #f59e0b;
        }

        .progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            border-radius: 4px;
        }

        .total-progress {
            background: #f0f2ff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .total-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
            color: #666;
        }

        .total-stats strong {
            color: #667eea;
            font-size: 18px;
        }

        .speed-info {
            text-align: right;
            color: #764ba2;
            font-weight: 600;
        }

        input[type="file"] {
            display: none;
        }

        .success-message {
            background: #10b981;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
            font-weight: 600;
        }

        /* 共享文件列表样式 */
        .file-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .shared-file-item {
            background: #f0f9ff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .shared-file-item:hover {
            background: #e0f2fe;
            transform: translateX(5px);
        }

        .shared-file-info {
            flex: 1;
        }

        .shared-file-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            word-break: break-all;
        }

        .shared-file-meta {
            font-size: 12px;
            color: #666;
        }

        .shared-file-actions {
            display: flex;
            gap: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 15px;
        }

        .empty-text {
            font-size: 16px;
        }

        .stats {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background: #f8f9ff;
            border-radius: 10px;
            color: #666;
            font-size: 14px;
        }

        /* 剪贴板通知样式 */
        .clipboard-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            max-width: 400px;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            z-index: 10000;
            display: none;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(450px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .clipboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .clipboard-title {
            font-weight: 600;
            color: #333;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .clipboard-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .clipboard-close:hover {
            background: #f0f0f0;
            color: #333;
        }

        .clipboard-content {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            max-height: 200px;
            overflow-y: auto;
            word-break: break-all;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 14px;
            color: #333;
            user-select: text;
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
        }

        .clipboard-actions {
            display: flex;
            gap: 10px;
        }

        .clipboard-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .clipboard-copy {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .clipboard-copy:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
        }

        .clipboard-history-btn {
            background: #f0f2ff;
            color: #667eea;
        }

        .clipboard-history-btn:hover {
            background: #e8ebff;
        }

        .clipboard-time {
            font-size: 12px;
            color: #999;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            .card {
                padding: 25px;
            }

            h1 {
                font-size: 24px;
            }

            .button-group {
                flex-direction: column;
            }

            .shared-file-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .shared-file-actions {
                margin-top: 10px;
                width: 100%;
            }

            .btn-small {
                flex: 1;
            }

            .clipboard-notification {
                top: 10px;
                right: 10px;
                left: 10px;
                max-width: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📁 局域网文件空投<span class="badge">V2</span></h1>
            <p class="subtitle">多设备文件共享 | 支持断点续传 | 超简单易用</p>

            <div class="info-box">
                <div class="info-box-title">💡 使用说明</div>
                <div class="info-box-text">
                    所有设备通过这个页面共享文件<br>
                    <strong>✅ 上传文件</strong>：点击「添加文件」，其他设备可下载<br>
                    <strong>✅ 下载文件</strong>：点击列表中的「下载」按钮<br>
                    <strong>✅ 大文件支持断点续传</strong>：网络中断自动恢复
                </div>
            </div>

            <!-- 上传区域 -->
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📤</div>
                <div class="upload-text">上传文件到共享区</div>
                <div class="upload-hint">拖拽文件到此处 | 支持大文件断点续传</div>
            </div>

            <input type="file" id="fileInput" multiple>

            <div class="button-group">
                <button class="btn btn-success" onclick="selectFiles()">➕ 添加文件</button>
                <button class="btn btn-primary" onclick="selectFolder()">📂 添加文件夹</button>
                <button class="btn btn-secondary" onclick="refreshFileList()">🔄 刷新列表</button>
            </div>

            <input type="file" id="folderInput" webkitdirectory directory multiple style="display: none;">

            <!-- 上传进度 -->
            <div class="progress-container" id="progressContainer" style="display: none;">
                <div class="total-progress">
                    <div class="total-stats">
                        <div>
                            <strong id="uploadedCount">0</strong> / <span id="totalCount">0</span> 文件
                        </div>
                        <div class="speed-info" id="speedInfo">0 MB/s</div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="totalProgress" style="width: 0%"></div>
                    </div>
                </div>

                <div id="uploadFileList"></div>
            </div>

            <div class="success-message" id="successMessage">
                ✅ 所有文件上传成功！
            </div>

            <!-- 共享文件列表 -->
            <h2>📋 共享文件列表</h2>
            <div class="file-list" id="fileList">
                <div class="empty-state">
                    <div class="empty-icon">📭</div>
                    <div class="empty-text">暂无共享文件</div>
                </div>
            </div>

            <div class="stats" id="stats">
                正在加载...
            </div>
        </div>
    </div>

    <!-- 剪贴板通知 -->
    <div class="clipboard-notification" id="clipboardNotification">
        <div class="clipboard-header">
            <div class="clipboard-title">📋 剪贴板同步</div>
            <button class="clipboard-close" onclick="closeClipboardNotification()">×</button>
        </div>
        <div class="clipboard-time" id="clipboardTime"></div>
        <div class="clipboard-content" id="clipboardContent"></div>
        <div class="clipboard-actions">
            <button class="clipboard-btn clipboard-copy" onclick="copyClipboard()">📋 复制</button>
            <button class="clipboard-btn clipboard-history-btn" onclick="closeClipboardNotification()">关闭</button>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const folderInput = document.getElementById('folderInput');
        const progressContainer = document.getElementById('progressContainer');
        const uploadFileList = document.getElementById('uploadFileList');
        const successMessage = document.getElementById('successMessage');
        const fileList = document.getElementById('fileList');
        const stats = document.getElementById('stats');

        let selectedFiles = [];
        const CHUNK_SIZE = 2 * 1024 * 1024; // 2MB per chunk

        // ==================== 拖拽上传 ====================
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('drag-over');
        });

        uploadArea.addEventListener('drop', async (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            
            const items = e.dataTransfer.items;
            const files = [];
            
            for (let i = 0; i < items.length; i++) {
                const item = items[i].webkitGetAsEntry();
                if (item) {
                    await traverseFileTree(item, files);
                }
            }
            
            if (files.length > 0) {
                selectedFiles = files;
                uploadFiles();
            }
        });

        async function traverseFileTree(item, files, path = '') {
            if (item.isFile) {
                const file = await new Promise((resolve) => {
                    item.file((f) => {
                        f.relativePath = path + f.name;
                        resolve(f);
                    });
                });
                files.push(file);
            } else if (item.isDirectory) {
                const dirReader = item.createReader();
                const entries = await new Promise((resolve) => {
                    dirReader.readEntries(resolve);
                });
                
                for (const entry of entries) {
                    await traverseFileTree(entry, files, path + item.name + '/');
                }
            }
        }

        // ==================== 文件选择 ====================
        
        function selectFiles() {
            fileInput.click();
        }

        function selectFolder() {
            folderInput.click();
        }

        fileInput.addEventListener('change', (e) => {
            selectedFiles = Array.from(e.target.files);
            selectedFiles.forEach(f => f.relativePath = f.name);
            uploadFiles();
        });

        folderInput.addEventListener('change', (e) => {
            selectedFiles = Array.from(e.target.files);
            selectedFiles.forEach(f => {
                f.relativePath = f.webkitRelativePath || f.name;
            });
            uploadFiles();
        });

        // ==================== 文件上传（支持断点续传） ====================
        
        function generateFileId(file) {
            return `${file.name}_${file.size}_${file.lastModified}`.replace(/[^a-zA-Z0-9]/g, '_');
        }

        async function uploadFiles() {
            if (selectedFiles.length === 0) return;

            progressContainer.style.display = 'block';
            successMessage.style.display = 'none';
            uploadFileList.innerHTML = '';

            document.getElementById('totalCount').textContent = selectedFiles.length;
            document.getElementById('uploadedCount').textContent = '0';

            let uploadedCount = 0;

            // 为每个文件创建进度显示
            selectedFiles.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.id = `file-${index}`;
                item.innerHTML = `
                    <div class="file-info">
                        <div class="file-name" title="${file.relativePath || file.name}">${file.relativePath || file.name}</div>
                        <div class="file-size">${formatSize(file.size)}</div>
                        <div class="file-status status-uploading" id="status-${index}">准备中...</div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-${index}" style="width: 0%"></div>
                    </div>
                `;
                uploadFileList.appendChild(item);
            });

            // 逐个上传文件（支持断点续传）
            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                const fileId = generateFileId(file);
                
                try {
                    // 检查是否有未完成的上传
                    const response = await fetch(`/check_chunks/${fileId}`);
                    const data = await response.json();
                    const uploadedChunks = data.uploaded_chunks || [];
                    
                    if (uploadedChunks.length > 0) {
                        document.getElementById(`status-${i}`).textContent = '⏸️ 从断点继续...';
                        document.getElementById(`status-${i}`).className = 'file-status status-resuming';
                    }
                    
                    await uploadFileWithChunks(file, i, fileId, uploadedChunks);
                    
                    uploadedCount++;
                    document.getElementById('uploadedCount').textContent = uploadedCount;
                    document.getElementById(`status-${i}`).textContent = '✅ 成功';
                    document.getElementById(`status-${i}`).className = 'file-status status-success';
                    document.getElementById(`progress-${i}`).style.width = '100%';
                    
                } catch (error) {
                    console.error('上传失败:', error);
                    document.getElementById(`status-${i}`).textContent = '❌ 失败';
                    document.getElementById(`status-${i}`).className = 'file-status status-error';
                }
                
                const totalProgress = ((i + 1) / selectedFiles.length) * 100;
                document.getElementById('totalProgress').style.width = totalProgress + '%';
            }

            if (uploadedCount === selectedFiles.length) {
                successMessage.style.display = 'block';
                setTimeout(() => {
                    progressContainer.style.display = 'none';
                    successMessage.style.display = 'none';
                    fileInput.value = '';
                    folderInput.value = '';
                }, 3000);
            }
            
            // 刷新文件列表
            refreshFileList();
        }

        async function uploadFileWithChunks(file, index, fileId, uploadedChunks) {
            const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
            let uploadedSize = uploadedChunks.length * CHUNK_SIZE;
            const startTime = Date.now();
            
            document.getElementById(`status-${index}`).textContent = '上传中...';
            
            for (let chunkIndex = 0; chunkIndex < totalChunks; chunkIndex++) {
                // 跳过已上传的分块
                if (uploadedChunks.includes(chunkIndex)) {
                    const progress = ((chunkIndex + 1) / totalChunks) * 100;
                    document.getElementById(`progress-${index}`).style.width = progress + '%';
                    continue;
                }
                
                const start = chunkIndex * CHUNK_SIZE;
                const end = Math.min(start + CHUNK_SIZE, file.size);
                const chunk = file.slice(start, end);
                
                const formData = new FormData();
                formData.append('file_id', fileId);
                formData.append('chunk_index', chunkIndex);
                formData.append('total_chunks', totalChunks);
                formData.append('filename', file.name);
                formData.append('chunk', chunk);
                formData.append('is_shared', 'true');  // 标记为共享文件
                
                const response = await fetch('/upload_chunk', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    throw new Error('上传失败');
                }
                
                uploadedSize += chunk.size;
                
                const progress = ((chunkIndex + 1) / totalChunks) * 100;
                document.getElementById(`progress-${index}`).style.width = progress + '%';
                
                const elapsed = (Date.now() - startTime) / 1000;
                const speed = uploadedSize / elapsed;
                document.getElementById('speedInfo').textContent = formatSpeed(speed);
            }
        }

        // ==================== 刷新文件列表 ====================
        
        async function refreshFileList() {
            try {
                const response = await fetch('/share_files');
                const data = await response.json();
                
                if (data.files && data.files.length > 0) {
                    fileList.innerHTML = '';
                    data.files.forEach(file => {
                        const item = document.createElement('div');
                        item.className = 'shared-file-item';
                        item.innerHTML = `
                            <div class="shared-file-info">
                                <div class="shared-file-name">📄 ${file.filename}</div>
                                <div class="shared-file-meta">${formatSize(file.size)} • ${new Date(file.timestamp).toLocaleString()}</div>
                            </div>
                            <div class="shared-file-actions">
                                <button class="btn-small btn-download" onclick="downloadFile('${file.id}', '${file.filename}')">
                                    💾 下载
                                </button>
                                <button class="btn-small btn-delete" onclick="deleteFile('${file.id}')">
                                    ❌ 删除
                                </button>
                            </div>
                        `;
                        fileList.appendChild(item);
                    });
                    
                    stats.innerHTML = `
                        📊 共 <strong>${data.files.length}</strong> 个共享文件
                    `;
                } else {
                    fileList.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📭</div>
                            <div class="empty-text">暂无共享文件</div>
                        </div>
                    `;
                    stats.innerHTML = '暂无共享文件';
                }
            } catch (e) {
                console.error('刷新文件列表失败', e);
            }
        }

        function downloadFile(fileId, filename) {
            const a = document.createElement('a');
            a.href = `/download/${fileId}`;
            a.download = filename;
            a.click();
        }

        async function deleteFile(fileId) {
            if (!confirm('确定要删除这个文件吗？')) return;
            
            try {
                const response = await fetch(`/download/${fileId}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    refreshFileList();
                }
            } catch (e) {
                console.error('删除失败', e);
            }
        }

        // ==================== 工具函数 ====================
        
        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function formatSpeed(bytesPerSecond) {
            return formatSize(bytesPerSecond) + '/s';
        }

        // ==================== Socket.IO 剪贴板同步 ====================
        
        let socket;
        let currentClipboardContent = '';
        
        // 初始化Socket.IO连接
        function initSocketIO() {
            try {
                socket = io();
                
                socket.on('connect', () => {
                    console.log('📋 剪贴板同步已连接');
                });
                
                socket.on('disconnect', () => {
                    console.log('❌ 剪贴板同步已断开');
                });
                
                socket.on('clipboard_update', (data) => {
                    showClipboardNotification(data);
                });
                
            } catch (e) {
                console.error('Socket.IO连接失败:', e);
            }
        }
        
        // 显示剪贴板通知
        function showClipboardNotification(data) {
            const notification = document.getElementById('clipboardNotification');
            const timeEl = document.getElementById('clipboardTime');
            const contentEl = document.getElementById('clipboardContent');
            
            currentClipboardContent = data.content;
            
            // 设置时间
            const time = new Date(data.timestamp);
            timeEl.textContent = time.toLocaleTimeString();
            
            // 设置内容
            contentEl.textContent = data.content;
            
            // 显示通知
            notification.style.display = 'block';
            
            // 5秒后自动关闭
            setTimeout(() => {
                closeClipboardNotification();
            }, 5000);
        }
        
        // 关闭剪贴板通知
        function closeClipboardNotification() {
            const notification = document.getElementById('clipboardNotification');
            notification.style.display = 'none';
        }
        
        // 复制剪贴板内容
        async function copyClipboard() {
            const btn = document.querySelector('.clipboard-copy');
            
            try {
                // 优先尝试现代 API
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(currentClipboardContent);
                    btn.textContent = '✅ 已复制';
                    setTimeout(() => {
                        btn.textContent = '📋 复制';
                    }, 2000);
                    return;
                }
            } catch (e) {
                console.log('Clipboard API 失败，使用降级方案');
            }
            
            // 降级方案：使用传统方法
            try {
                const textArea = document.createElement('textarea');
                textArea.value = currentClipboardContent;
                textArea.style.position = 'fixed';
                textArea.style.left = '-999999px';
                textArea.style.top = '-999999px';
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                
                const successful = document.execCommand('copy');
                document.body.removeChild(textArea);
                
                if (successful) {
                    btn.textContent = '✅ 已复制';
                    setTimeout(() => {
                        btn.textContent = '📋 复制';
                    }, 2000);
                } else {
                    throw new Error('execCommand 失败');
                }
            } catch (e) {
                // 如果都失败了，显示文本选择提示
                const contentEl = document.getElementById('clipboardContent');
                contentEl.style.userSelect = 'text';
                
                // 自动选中文本
                const range = document.createRange();
                range.selectNodeContents(contentEl);
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
                
                btn.textContent = '⬆️ 已选中，请手动复制';
                setTimeout(() => {
                    btn.textContent = '📋 复制';
                    contentEl.style.userSelect = '';
                }, 3000);
            }
        }
        
        // 页面加载时初始化
        refreshFileList();
        initSocketIO();
        
        // 每5秒自动刷新
        setInterval(refreshFileList, 5000);
    </script>
</body>
</html>
